<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>밤이 작아지는 서울 (Night Seoul UI)</title>
    <!-- Gowun Dodum 폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #030305;
            overflow: hidden;
            font-family: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            color: #ffffff;
        }

        /* 우주 밤하늘 배경 (Canvas 별밭) */
        #space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 2;
        }

        #map {
            width: 100%;
            height: 100%;
            background: transparent !important;
        }

        /* 카카오 기본 지도 배경 완전 제거 */
        #map .kakao_map,
        #map canvas,
        #map img {
            background: transparent !important;
        }

        #map canvas,
        #map img[src*="daumcdn"],
        #map img[src*="kakaocdn"] {
            display: none !important;
        }

        /* ================= 반투명 야간 테마 UI 패널 ================= */
        .ui-panel {
            position: absolute;
            top: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 18px;
            color: #ffff9f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-shadow: 0 0 10px rgba(255, 255, 159, 0.5);
        }

        .panel-title-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 24시 스위치 토글 스타일 */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #ffffff;
            font-weight: 600;
            text-shadow: none;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .3s;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ffff9f;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
            background-color: #0f172a;
        }

        /* 좌측 패널 */
        #left-panel {
            left: 24px;
            width: 320px;
        }

        /* 우측 패널 */
        #right-panel {
            right: 24px;
            width: 260px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 7px;
            font-weight: 500;
        }

        .input-control {
            width: 100%;
            padding: 11px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-control:focus {
            border-color: #ffff9f;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 159, 0.3);
        }

        /* 다이얼 방식 3D 스크롤 피커 */
        .picker-wrapper {
            position: relative;
            height: 105px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            overflow: hidden;
        }

        .picker-selection {
            position: absolute;
            top: 35px;
            left: 0;
            width: 100%;
            height: 35px;
            background: rgba(255, 255, 159, 0.12);
            border-top: 1px solid rgba(255, 255, 159, 0.4);
            border-bottom: 1px solid rgba(255, 255, 159, 0.4);
            pointer-events: none;
            z-index: 2;
        }

        .wheel-container {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding: 35px 0;
            box-sizing: border-box;
        }

        .wheel-container::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 35px;
            line-height: 35px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            scroll-snap-align: center;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        .wheel-item.active {
            color: #ffff9f;
            font-size: 15px;
            text-shadow: 0 0 8px rgba(255, 255, 159, 0.6);
        }

        /* 반투명 발광 버튼 */
        .btn-action {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: rgba(255, 255, 159, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 159, 0.5);
            border-radius: 10px;
            color: #ffff9f;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 159, 0.15);
            text-align: center;
            font-family: inherit;
        }

        .btn-action:hover {
            background: rgba(255, 255, 159, 0.3);
            border-color: #ffff9f;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 255, 159, 0.5);
        }

        /* 카테고리 필터 리스트 */
        .category-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        .category-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .category-item label {
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-item input[type="checkbox"] {
            accent-color: #ffff9f;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* 현위치 빨간 핀셋 커스텀 오버레이 */
        .user-location-pin {
            font-size: 26px;
            filter: drop-shadow(0 0 10px #ff4757);
            animation: pin-bounce 1.5s infinite alternate ease-in-out;
            cursor: pointer;
        }

        /* 개별 카테고리 이모지 마커 */
        .emoji-facility-pin {
            font-size: 22px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            cursor: pointer;
            transition: transform 0.2s ease;
            user-select: none;
        }
        .emoji-facility-pin:hover {
            transform: scale(1.4);
            filter: drop-shadow(0 0 14px #ffff9f);
        }

        /* 야간 테마 가게 정보 팝업창 */
        .facility-info-popup {
            position: relative;
            bottom: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 159, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            min-width: 180px;
            max-width: 240px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 10px rgba(255, 255, 159, 0.2);
            font-size: 12px;
            color: #ffffff;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffff9f;
            text-shadow: 0 0 6px rgba(255, 255, 159, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }

        .popup-close-btn {
            cursor: pointer;
            color: #94a3b8;
            font-weight: 700;
            font-size: 12px;
            transition: color 0.2s;
        }
        .popup-close-btn:hover {
            color: #ffffff;
        }

        .popup-address {
            color: #cbd5e1;
            font-size: 11px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .popup-hours {
            color: #a7f3d0;
            font-size: 11px;
            line-height: 1.4;
            margin-top: 5px;
            word-break: keep-all;
        }

        @keyframes pin-bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* 주요 지역 별 마커 & 라벨 스타일 */
        .station-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .yellow-star-marker {
            width: 5px;
            height: 5px;
            background-color: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 6px #FFFF9F, 0 0 12px #FFFF9F, 0 0 18px #FFFF9F;
            flex-shrink: 0;
        }

        .station-label {
            display: none;
            margin-left: 6px;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            text-shadow: 0 0 4px #000000, 0 0 8px #000000;
            pointer-events: none;
        }

        .show-label .station-label {
            display: inline-block;
        }
    </style>
    <!-- 카카오 지도 SDK -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a0fbb7f732e990469dfc756f73c12e06&libraries=services"></script>
</head>
<body>

<!-- 밤하늘 별밭 배경 Canvas -->
<canvas id="space-bg"></canvas>

<!-- 지도 영역 -->
<div id="map-container">
    <div id="map"></div>
</div>

<!-- 1. 좌측 UI 패널: 위치 및 기준 일시 설정 -->
<div id="left-panel" class="ui-panel">
    <div class="panel-title">
        <div class="panel-title-left">
            <span>🌙 심야 이동 범위 검색</span>
        </div>
    </div>
    
    <!-- 위치 선택 다이얼 휠 -->
    <div class="input-group">
        <label>📍 어디서 출발하나요?</label>
        <div class="picker-wrapper">
            <div class="picker-selection"></div>
            <div class="wheel-container" id="location-wheel" onscroll="handleLocationWheelScroll()">
                <div class="wheel-item active" data-value="CURRENT_LOCATION" id="current-location-item">📍 내 현재 위치</div>
            </div>
        </div>
    </div>

    <!-- 날짜 선택 -->
    <div class="input-group">
        <label for="base-date">📅 날짜를 입력하세요.</label>
        <input type="date" id="base-date" class="input-control">
    </div>

    <!-- 시각 선택 다이얼 휠 -->
    <div class="input-group">
        <label>🍷 몇시에 출발하나요?</label>
        <div class="picker-wrapper">
            <div class="picker-selection"></div>
            <div class="wheel-container" id="time-wheel" onscroll="handleTimeWheelScroll()">
                <div class="wheel-item" data-time="22:30">22 : 30</div>
                <div class="wheel-item" data-time="23:00">23 : 00</div>
                <div class="wheel-item active" data-time="23:30">23 : 30</div>
                <div class="wheel-item" data-time="00:00">00 : 00</div>
                <div class="wheel-item" data-time="00:30">00 : 30</div>
            </div>
        </div>
    </div>

    <button id="btn-calculate" class="btn-action" onclick="handleRangeCalculate()">
        서울 어디까지 갈 수 있을까?
    </button>
</div>

<!-- 2. 우측 UI 패널: 24시 스위치 토글 추가 및 이모지/라벨 반영 -->
<div id="right-panel" class="ui-panel">
    <div class="panel-title">
        <div class="panel-title-left">
            <span>🏪 내 주변 시설</span>
        </div>
        <div class="toggle-container">
            <span>24시</span>
            <label class="toggle-switch">
                <input type="checkbox" id="toggle-24h" checked onchange="handleCategoryChange()">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    
    <div class="category-list">
        <div class="category-item">
            <label for="cat-cafe">☕ 카페</label>
            <input type="checkbox" id="cat-cafe" value="카페" data-emoji="☕" data-has-24h="true" onchange="handleCategoryChange()">
        </div>
        <div class="category-item">
            <label for="cat-pub">🍺 주점/술집</label>
            <input type="checkbox" id="cat-pub" value="술집,주점" data-emoji="🍺" onchange="handleCategoryChange()">
        </div>
        <div class="category-item">
            <label for="cat-cvs">🏪 편의점</label>
            <input type="checkbox" id="cat-cvs" value="편의점" data-emoji="🏪" onchange="handleCategoryChange()">
        </div>
        <div class="category-item">
            <label for="cat-pharmacy">💊 약국</label>
            <input type="checkbox" id="cat-pharmacy" value="약국" data-emoji="💊" data-has-24h="true" onchange="handleCategoryChange()">
        </div>
        <div class="category-item">
            <label for="cat-hospital">🏥 병원</label>
            <input type="checkbox" id="cat-hospital" value="병원" data-emoji="🏥" data-has-24h="true" onchange="handleCategoryChange()">
        </div>
        <div class="category-item">
            <label for="cat-entertainment">🎮 PC방 / 노래방</label>
            <input type="checkbox" id="cat-entertainment" value="PC방,노래방" data-emoji="🎮" onchange="handleCategoryChange()">
        </div>
        <div class="category-item">
            <label for="cat-study">📖 스터디카페</label>
            <input type="checkbox" id="cat-study" value="스터디카페" data-emoji="📖" onchange="handleCategoryChange()">
        </div>
    </div>
</div>

<script>
    document.getElementById('base-date').value = new Date().toISOString().substring(0, 10);

    // 1. 밤하늘 별 배경 생성
    const bgCanvas = document.getElementById('space-bg');
    const ctx = bgCanvas.getContext('2d');

    function resizeCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 1.2 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.015 + 0.005
    }));

    function drawStars() {
        ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        stars.forEach(star => {
            star.alpha += star.speed;
            if (star.alpha > 1 || star.alpha < 0.2) star.speed = -star.speed;
            
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
            ctx.fill();
        });
        requestAnimationFrame(drawStars);
    }
    drawStars();

    // 2. 카카오 지도 초기화
    const container = document.getElementById('map');
    const options = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 8,
        draggable: true
    };
    const map = new kakao.maps.Map(container, options);

    map.setMaxLevel(8);

    const seoulBounds = new kakao.maps.LatLngBounds(
        new kakao.maps.LatLng(37.4138, 126.7341),
        new kakao.maps.LatLng(37.7151, 127.2693)
    );

    kakao.maps.event.addListener(map, 'dragend', function() {
        const center = map.getCenter();
        if (!seoulBounds.contain(center)) {
            map.panTo(new kakao.maps.LatLng(37.5665, 126.9780));
        }
    });

    const stationOverlays = [];
    let reachabilityShapes = [];
    let userCurrentCoords = null;
    let userLocationMarker = null;
    let categoryEmojiOverlays = [];
    let activeInfoWindow = null;

    function displayUserPin(lat, lng) {
        if (userLocationMarker) userLocationMarker.setMap(null);

        const pinDiv = document.createElement('div');
        pinDiv.className = 'user-location-pin';
        pinDiv.innerText = '📍';

        userLocationMarker = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(lat, lng),
            content: pinDiv,
            xAnchor: 0.5,
            yAnchor: 1.0
        });

        userLocationMarker.setMap(map);
        map.panTo(new kakao.maps.LatLng(lat, lng));
    }

    function getCurrentActiveCoords() {
        const activeItem = document.querySelector('#location-wheel .wheel-item.active');
        const val = activeItem ? activeItem.getAttribute('data-value') : 'CURRENT_LOCATION';

        if (val === 'CURRENT_LOCATION') {
            return userCurrentCoords || { lat: 37.5665, lng: 126.9780 };
        } else {
            return targetCoordsMap.get(val) || { lat: 37.5665, lng: 126.9780 };
        }
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                userCurrentCoords = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                console.log("📍 GPS 위치 취득 성공:", userCurrentCoords);

                const currentLocationItem = document.getElementById('current-location-item');
                if (currentLocationItem) {
                    currentLocationItem.innerText = '📍 내 현재 위치';
                }

                const activeItem = document.querySelector('#location-wheel .wheel-item.active');
                if (!activeItem || activeItem.getAttribute('data-value') === 'CURRENT_LOCATION') {
                    displayUserPin(userCurrentCoords.lat, userCurrentCoords.lng);
                }
            },
            (error) => {
                console.warn("GPS 탐색 실패:", error.message);
                userCurrentCoords = { lat: 37.5665, lng: 126.9780 };
                const currentLocationItem = document.getElementById('current-location-item');
                if (currentLocationItem) {
                    currentLocationItem.innerText = '📍 내 현재 위치 (위치 허용 필요)';
                }
                displayUserPin(userCurrentCoords.lat, userCurrentCoords.lng);
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }

    function toggleStationLabels() {
        const currentLevel = map.getLevel();

        if (currentLevel > 8) {
            map.setLevel(8, { animate: false });
            return;
        }

        stationOverlays.forEach(item => {
            if (currentLevel <= 7) {
                item.element.classList.add('show-label');
            } else {
                item.element.classList.remove('show-label');
            }
        });
    }

    kakao.maps.event.addListener(map, 'zoom_changed', toggleStationLabels);

    // 3. 100개 서울 주요 지역 목록
    const targetLocations = [
        { district: "강남구", name: "강남역" }, { district: "강남구", name: "역삼" }, { district: "강남구", name: "선릉" },
        { district: "강남구", name: "삼성" }, { district: "강남구", name: "압구정" }, { district: "강남구", name: "수서" },
        { district: "강동구", name: "천호" }, { district: "강동구", name: "강동" }, { district: "강동구", name: "길동" }, { district: "강동구", name: "고덕" },
        { district: "강북구", name: "수유" }, { district: "강북구", name: "미아" }, { district: "강북구", name: "미아사거리" },
        { district: "강서구", name: "김포공항" }, { district: "강서구", name: "마곡" }, { district: "강서구", name: "발산" }, { district: "강서구", name: "화곡" },
        { district: "관악구", name: "신림" }, { district: "관악구", name: "서울대입구" }, { district: "관악구", name: "낙성대" }, { district: "관악구", name: "봉천" },

    function handleLocationWheelScroll() {
        const wheel = document.getElementById('location-wheel');
        const items = wheel.querySelectorAll('.wheel-item');
        const activeIndex = Math.round(wheel.scrollTop / 35);

        items.forEach((item, index) => {
            if (index === activeIndex) {
                if (!item.classList.contains('active')) {
                    item.classList.add('active');
                    const val = item.getAttribute('data-value');

                    if (val === 'CURRENT_LOCATION') {
                        if (userCurrentCoords) {
                            displayUserPin(userCurrentCoords.lat, userCurrentCoords.lng);
                        }
                    } else {
                        const target = targetCoordsMap.get(val);
                        if (target) {
                            displayUserPin(target.lat, target.lng);
                        }
                    }
                    handleCategoryChange();
                }
            } else {
                item.classList.remove('active');
            }
        });
    }

        const wheel = document.getElementById('time-wheel');
        const items = wheel.querySelectorAll('.wheel-item');

        items.forEach((item, index) => {

    // 이모지 마커 클릭 시 정보 팝업창을 띄우는 함수 (운영시간 추가)
    function showPlaceInfoPopup(place, lat, lng) {
        if (activeInfoWindow) {
            activeInfoWindow.setMap(null);
        }

        const address = place.road_address_name || place.address_name || '주소 정보 없음';
        
        // 24시 조건 및 정보에 따른 운영시간 구하기
        const is24hOn = document.getElementById('toggle-24h') ? document.getElementById('toggle-24h').checked : false;
        let hoursText = "09:00 - 22:00 (상세 문의)";

        if (place.place_name.includes('24') || (is24hOn && (place.place_name.includes('카페') || place.place_name.includes('약국') || place.place_name.includes('병원')))) {
            hoursText = "24시간 영업 (연중무휴)";
        } else if (place.category_name && place.category_name.includes('편의점')) {
            hoursText = "24시간 영업";
        } else if (place.phone) {
            hoursText = `운영시간 문의 (${place.phone})`;
        }

        const popupDiv = document.createElement('div');
        popupDiv.className = 'facility-info-popup';
        popupDiv.innerHTML = `
            <div class="popup-header">
                <span class="popup-title">${place.place_name}</span>
                <span class="popup-close-btn" onclick="closePlaceInfoPopup()">✕</span>
            </div>
            <div class="popup-address">📍 ${address}</div>
            <div class="popup-hours">⏰ ${hoursText}</div>
        `;

        activeInfoWindow = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(lat, lng),
            content: popupDiv,
            xAnchor: 0.5,
            yAnchor: 1.25,
            zIndex: 99
        });

        activeInfoWindow.setMap(map);
    }

    function closePlaceInfoPopup() {
        if (activeInfoWindow) {
            activeInfoWindow.setMap(null);
            activeInfoWindow = null;
        }

    // 조건에 맞춰 개별 카테고리 검색 및 이모지 마커 표시 (24시 토글 로직 포함)

        closePlaceInfoPopup();
        categoryEmojiOverlays.forEach(overlay => overlay.setMap(null));
        categoryEmojiOverlays = [];

        const checkedElements = document.querySelectorAll('.category-list input[type="checkbox"]:checked');
        if (checkedElements.length === 0) return;

        const is24hOn = document.getElementById('toggle-24h').checked;

        const centerLatLng = new kakao.maps.LatLng(currentCoords.lat, currentCoords.lng);

        checkedElements.forEach(cb => {
            const rawValues = cb.value.split(',');
            const emoji = cb.getAttribute('data-emoji') || '📍';
            const has24hOption = cb.getAttribute('data-has-24h') === 'true';

            rawValues.forEach(keyword => {

                if (has24hOption && is24hOn) {

                ps.keywordSearch(searchKeyword, (data, status) => {
                    if (status === kakao.maps.services.Status.OK) {

                                position: new kakao.maps.LatLng(place.y, place.x),

                                xAnchor: 0.5,
                                yAnchor: 0.5
                            });

                            emojiOverlay.setMap(map);
                            categoryEmojiOverlays.push(emojiOverlay);
                        });

                    location: centerLatLng,
                    radius: 500

    function getSelectedTime() {
        const activeItem = document.querySelector('#time-wheel .wheel-item.active');
        return activeItem ? activeItem.getAttribute('data-time') : '23:30';

    // =========================================================
    // 도달 가능 범위 시각화
    // =========================================================

    function clearReachabilityShapes() {
        reachabilityShapes.forEach(shape => shape.setMap(null));
        reachabilityShapes = [];
    }

    function distanceMeters(a, b) {
        const R = 6371000;
        const toRad = deg => deg * Math.PI / 180;

        const lat1 = toRad(a.lat);
        const lat2 = toRad(b.lat);
        const dLat = toRad(b.lat - a.lat);
        const dLon = toRad(b.lon - a.lon);

        const h =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1) * Math.cos(lat2) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);

        return 2 * R * Math.asin(Math.sqrt(h));
    }

    function drawSoftGlowArea(point) {
        const center = new kakao.maps.LatLng(point.lat, point.lon);

        const outer = new kakao.maps.Circle({
            center: center,
            radius: 900,
            strokeWeight: 0,
            strokeOpacity: 0,
            fillColor: '#FFFF6F',
            fillOpacity: 0.025
        });

        const middle = new kakao.maps.Circle({
            center: center,
            radius: 650,
            strokeWeight: 0,
            strokeOpacity: 0,
            fillColor: '#FFFF6F',
            fillOpacity: 0.045
        });

        const inner = new kakao.maps.Circle({
            center: center,
            radius: 380,
            strokeWeight: 0,
            strokeOpacity: 0,
            fillColor: '#FFFF6F',
            fillOpacity: 0.065
        });

        outer.setMap(map);
        middle.setMap(map);
        inner.setMap(map);

        reachabilityShapes.push(outer, middle, inner);
    }

    function drawSoftConnection(a, b) {
        const path = [
            new kakao.maps.LatLng(a.lat, a.lon),
            new kakao.maps.LatLng(b.lat, b.lon)
        ];

        const wide = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 14,
            strokeColor: '#FFFF6F',
            strokeOpacity: 0.035,
            strokeStyle: 'solid'
        });

        const thin = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 5,
            strokeColor: '#FFFF8A',
            strokeOpacity: 0.055,
            strokeStyle: 'solid'
        });

        wide.setMap(map);
        thin.setMap(map);

        reachabilityShapes.push(wide, thin);
    }

    function drawReachabilityArea(data) {
        clearReachabilityShapes();

        const reachable = data.results
            .filter(item => item.reachable === true)
            .map(item => ({
                name: item.name,
                lat: item.lat,
                lon: item.lon
            }));

        if (data.start) {
            reachable.push({
                name: data.start.name,
                lat: data.start.lat,
                lon: data.start.lon
            });
        }

        if (reachable.length === 0) return;

        reachable.forEach(point => {
            drawSoftGlowArea(point);
        });

        const madeConnections = new Set();

        reachable.forEach((point, i) => {
            const nearest = reachable
                .map((other, j) => ({
                    index: j,
                    point: other,
                    distance: i === j ? Infinity : distanceMeters(point, other)
                }))
                .sort((x, y) => x.distance - y.distance)
                .slice(0, 2);

            nearest.forEach(item => {
                if (item.distance > 2600) return;

                const key = [i, item.index].sort((a, b) => a - b).join('-');
                if (madeConnections.has(key)) return;

                madeConnections.add(key);
                drawSoftConnection(point, item.point);
            });
        });
    }

    function handleRangeCalculate() {
        const activeItem = document.querySelector('#location-wheel .wheel-item.active');
        const selectedLoc = activeItem
            ? activeItem.getAttribute('data-value')
            : 'CURRENT_LOCATION';

        const dateValue = document.getElementById('base-date').value;
        const timeValue = getSelectedTime();
        const button = document.getElementById('btn-calculate');

        const payload = {
            date: dateValue,
            time: timeValue
        };

        if (selectedLoc === 'CURRENT_LOCATION') {
            if (!userCurrentCoords) {
                alert('현재 위치를 아직 불러오지 못했습니다. 잠시 후 다시 시도하거나 대표 지역을 선택해주세요.');
                return;
            }

            payload.start_lat = userCurrentCoords.lat;
            payload.start_lon = userCurrentCoords.lng;
            payload.start_name = '내 현재 위치';
        } else {
            payload.start_name = selectedLoc;
        }

        console.log('[실시간 이동 범위 계산 요청]', payload);

        const oldText = button.innerText;
        button.disabled = true;
        button.innerText = '계산 중...';

        fetch('/api/reachability', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(async response => {
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || '이동 가능 범위를 계산하지 못했습니다.');
            }

            return data;
        })
        .then(data => {
            drawReachabilityArea(data);

            const reachableCount = data.results.filter(
                item => item.reachable === true
            ).length;

            const unreachableCount = data.results.filter(
                item => item.reachable === false
            ).length;

            console.log(
                `도달 가능 ${reachableCount}곳 / 도달 불가 ${unreachableCount}곳`
            );

            button.innerText = `도달 가능 ${reachableCount}곳`;
        })
        .catch(error => {
            console.error('이동 가능 범위 계산 오류:', error);
            alert(error.message);
            button.innerText = oldText;
        })
        .finally(() => {
            button.disabled = false;

            setTimeout(() => {
                if (!button.disabled) {
                    button.innerText = '서울 어디까지 갈 수 있을까?';
                }
            }, 2500);
        });
    }
